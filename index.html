<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naija Danfo Bus | Pure CSS Art</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1 class="title">🚌 Naija Danfo Bus — Built With Pure CSS</h1>

  <div class="scene">
    <div class="sky"></div>
    <div class="sun"></div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="road"></div>
    <div class="road-line line-1"></div>
    <div class="road-line line-2"></div>
    <div class="road-line line-3"></div>

    <div class="danfo-bus">
      <div class="bus-roof"></div>
      <div class="bus-body"></div>
      <div class="bus-stripe stripe-top"></div>
      <div class="bus-stripe stripe-bottom"></div>

      <div class="bus-window front-window"></div>
      <div class="bus-window mid-window"></div>
      <div class="bus-window back-window"></div>

      <div class="bus-door"></div>
      <div class="door-handle"></div>

      <div class="number-plate">LAGOS</div>

      <div class="headlight"></div>
      <div class="taillight"></div>
      <div class="bumper"></div>
      <div class="wing-mirror"></div>

      <div class="wheel front-wheel">
        <div class="hubcap"></div>
      </div>
      <div class="wheel back-wheel">
        <div class="hubcap"></div>
      </div>
    </div>
  </div>

  <p class="caption">Made with only HTML &amp; CSS — no images used 🇳🇬</p>

</body>
</html>
